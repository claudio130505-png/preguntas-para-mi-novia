<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ti ❤️</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; font-family:"Segoe UI", Arial, sans-serif; color:white; overflow:hidden; display:flex; align-items:center; justify-content:center; text-align:center; background: radial-gradient(ellipse at bottom, #1b0033 0%, #0d001a 40%, #000000 100%); }
.estrella { position:absolute; background:white; border-radius:50%; animation:brillar 2s infinite alternate; }
@keyframes brillar { from { opacity:.3; transform:scale(.8);} to { opacity:1; transform:scale(1.3);} }
.flor { position:fixed; top:-50px; font-size:28px; animation:caer linear infinite; pointer-events:none; z-index:2; }
@keyframes caer { to { transform: translateY(110vh) rotate(360deg); } }
.contenedor { position:relative; z-index:3; max-width:700px; padding:30px; animation:aparecer 1.5s ease; }
@keyframes aparecer { from { opacity:0; transform:translateY(30px);} to { opacity:1; transform:translateY(0);} }
h1 { font-size:clamp(35px, 7vw, 60px); margin-bottom:20px; background:linear-gradient(90deg, #ff6ec7, #ffffff, #ff6ec7); -webkit-background-clip:text; color:transparent; }
#mensaje { font-size:clamp(20px, 4vw, 28px); line-height:1.6; min-height:100px; color:#ffd6ec; margin-bottom:30px; }
.corazon { font-size:70px; animation:latido 1.2s infinite; margin-bottom:20px; }
@keyframes latido { 50% { transform:scale(1.2);} }
.btn { border:none; padding:16px 35px; border-radius:50px; color:white; background:linear-gradient(135deg, #ff1744, #ff6ec7); font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 10px 30px rgba(255,23,68,.5); transition:.3s; }
.btn:hover { transform:scale(1.05); }
#contador { margin-top:25px; font-size:18px; color:#ffb3d9; }
</style>
</head>
<body>

<div class="contenedor">
    <div class="corazon">❤️</div>
    <h1>Para ti, mi amor</h1>
    <p id="mensaje"></p>
    <button class="btn" onclick="siguienteMensaje()">Toca aquí ❤️</button>
    <p id="contador"></p>
</div>

<script>
// Crear galaxia
for(let i=0; i<150; i++){
    let estrella = document.createElement("div");
    estrella.className = "estrella";
    let tam = Math.random()*3+1;
    estrella.style.width = tam+"px";
    estrella.style.height = tam+"px";
    estrella.style.left = Math.random()*100+"vw";
    estrella.style.top = Math.random()*100+"vh";
    estrella.style.animationDuration = (Math.random()*2+1)+"s";
    document.body.appendChild(estrella);
}
// Crear flores cayendo
const flores = ["🌸","🌺","🌷","💮","🌹"];
for(let i=0; i<20; i++){
    let flor = document.createElement("div");
    flor.className = "flor";
    flor.textContent = flores[Math.floor(Math.random()*flores.length)];
    flor.style.left = Math.random()*100+"vw";
    flor.style.animationDuration = (Math.random()*6+6)+"s";
    flor.style.animationDelay = Math.random()*5+"s";
    document.body.appendChild(flor);
}
// Mensajes de amor
const mensajes = [
    "Si las estrellas pudieran hablar, todas dirían tu nombre...",
    "En toda esta galaxia inmensa, mi lugar favorito es a tu lado.",
    "No necesito contar las estrellas, porque mi amor por ti es infinito.",
    "Eres mi casualidad más bonita, mi historia favorita.",
    "Te amo hoy, mañana y en todas las vidas que existan. ❤️"
];
let indice = 0;
let contadorAmor = 0;

function escribirTexto(texto){
    const elemento = document.getElementById("mensaje");
    elemento.textContent = "";
    let i = 0;
    const intervalo = setInterval(() => {
        elemento.textContent += texto[i];
        i++;
        if(i >= texto.length) clearInterval(intervalo);
    }, 50);
}

function siguienteMensaje(){
    escribirTexto(mensajes[indice]);
    indice = (indice + 1) % mensajes.length;
}

// Contador infinito de Te Amo
setInterval(() => {
    contadorAmor += 100;
    document.getElementById("contador").textContent = "Te amo x" + contadorAmor.toLocaleString() + " y subiendo... ♾️";
}, 100);

escribirTexto(mensajes[0]);
indice = 1;
</script>
</body>
</html>
